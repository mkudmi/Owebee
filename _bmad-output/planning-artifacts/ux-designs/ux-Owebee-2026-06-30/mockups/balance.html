<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owebee — Balance</title>
<style>
/* Governed by DESIGN.md Balance components and EXPERIENCE.md Flow 5, Financial Language, State Patterns. */
:root{--bg:#f7f7fb;--surface:#fff;--ink:#172033;--muted:#4b5563;--primary:#1d4ed8;--border:#cbd5e1;--warning:#92400e;--warning-bg:#fffbeb;--focus:#0f172a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:24px}.phone{width:min(390px,100%);min-height:780px;background:var(--bg);border:1px solid var(--border);border-radius:28px;box-shadow:0 16px 40px rgba(23,32,51,.14);overflow:hidden}
header{background:white;padding:18px 20px;border-bottom:1px solid var(--border)}header small{display:block;color:var(--muted)}h1{font-size:28px;margin:0}.content{padding:18px 16px 90px}.notice{background:var(--warning-bg);color:var(--warning);padding:12px;border-radius:8px;margin-bottom:12px;font-size:14px}.card{background:white;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px}
.label{color:var(--muted);font-weight:600}.total{font-size:36px;font-weight:700;line-height:1.15;margin:2px 0}.meta{color:var(--muted);font-size:14px}.rowhead{display:flex;justify-content:space-between;gap:16px}.badge{background:var(--bg);padding:3px 8px;border-radius:999px;font-size:12px;white-space:nowrap}.direction{font-weight:700;font-size:20px;margin-top:8px}.disclosure{border:0;background:none;padding:10px 0 0;color:var(--primary);font:600 15px Inter,system-ui}.calc{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;font-size:14px}.calc div{display:flex;justify-content:space-between}.sum{font-weight:700;margin-top:8px}
nav{position:absolute;bottom:0;width:min(388px,calc(100vw - 50px));display:grid;grid-template-columns:repeat(4,1fr);background:white;border-top:1px solid var(--border);padding:10px 4px 16px}nav a{text-align:center;color:var(--muted);font-size:12px;text-decoration:none}nav a.active{color:var(--primary);font-weight:700}:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<main class="stage">
  <section class="phone" aria-label="Balance screen mockup" style="position:relative">
    <header><h1>Balance</h1><small>Georgia 2026 · Base currency RUB</small></header>
    <div class="content">
      <div class="notice">This balance does not include 1 change waiting to sync.</div>
      <section class="card"><div class="label">You owe</div><div class="total">₽3,200</div><div class="meta">Updated 2 minutes ago</div></section>
      <section class="card">
        <div class="rowhead"><strong>Ivanov family</strong><span class="badge">Family · 2 shares</span></div>
        <div class="direction">Owes ₽3,200</div>
        <button class="disclosure" type="button" aria-expanded="true">Hide calculation</button>
        <div class="calc"><div><span>Dinner · 2 of 5 shares</span><span>₽1,783.40</span></div><div><span>Hotel · 2 of 5 shares</span><span>₽1,416.60</span></div><div class="sum"><span>Total owed</span><span>₽3,200</span></div></div>
      </section>
    </div>
    <nav aria-label="Trip"><a href="#">Overview</a><a href="#">Expenses</a><a class="active" href="#" aria-current="page">Balance</a><a href="#">People</a></nav>
  </section>
</main>
</body>
</html>
